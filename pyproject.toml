[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budgetmix-lab"
version = "0.1.0"
description = "Reproduce and extend Zhu et al. (arXiv:2611.06483): multi-turn RL gains depend on interaction budgets, and BudgetMix RL fixes it -- on a small CPU testbed"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
